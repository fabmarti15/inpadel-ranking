<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Polla · 3 estilos</title>
<style>
:root{
  --bg:#f4f4f1; --c:#fff; --i:#171717; --m:#73706c; --l:#e4e1dc;
  --g:#1a7a44; --gold:#d9970f;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--i)}
.shell{max-width:460px;margin:0 auto;padding:0 0 60px}

/* ── switcher ── */
.switch{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--l)}
.switch .lbl{font-size:.72rem;color:var(--m);font-weight:800;margin:0 0 8px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#e9e6e0;border-radius:12px;padding:5px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font:inherit;font-weight:800;font-size:.78rem;color:var(--m);cursor:pointer;line-height:1.15}
.seg button b{display:block;font-size:.68rem;font-weight:700;color:#a8a49d}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 2px 8px #0000000f}
.seg button.on b{color:var(--g)}

.panel{display:none;padding:16px 14px}
.panel.on{display:block}

/* shared search + bombazo */
.srch{position:relative;display:none;margin-top:8px}
.srch.open{display:block}
.srch input{width:100%;border:1px solid #e0ddd5;border-radius:10px;padding:10px 12px;font:inherit;font-size:.85rem;background:#fff}
.srch input:focus{outline:none;border-color:var(--g)}
.sug{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid #e0ddd5;border-radius:10px;box-shadow:0 10px 26px #0000001f;z-index:5;display:none;max-height:220px;overflow-y:auto}
.sug.show{display:block}
.sug div{padding:10px 12px;font-size:.84rem;font-weight:800;cursor:pointer;border-bottom:1px solid #f3f0e9;display:flex;justify-content:space-between;align-items:center}
.sug div:last-child{border-bottom:0}
.sug .mini{font-size:.72rem;font-weight:900;color:var(--gold)}
.sug .nores{color:#aaa;font-weight:700;justify-content:flex-start}
.opt.injected{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--gold);background:#fff7e8;border-radius:11px;padding:11px 14px;margin-bottom:7px;cursor:pointer}
.opt.injected .io-nm{font-size:.85rem;font-weight:900;color:#7a5a00}
.opt.injected .io-c{font-weight:950;font-size:.9rem;color:#fff;background:var(--gold);border-radius:8px;padding:4px 10px}
.io-nm b{font-size:.58rem;letter-spacing:.04em}

/* ══════════ VARIANTE A · Casa de apuestas ══════════ */
.va .card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px 18px;margin-bottom:14px;box-shadow:0 10px 30px #1111}
.va .top{display:flex;justify-content:space-between;align-items:center}
.va .h{font-size:1.18rem;font-weight:950;display:flex;align-items:center;gap:7px}
.va .racha{font-size:.72rem;font-weight:900;color:#b8860b;background:#fdf3dc;border:1px solid #f0e0b0;border-radius:20px;padding:5px 10px}
.va .sub{font-size:.76rem;color:var(--m);margin:5px 0 15px;line-height:1.4}
.va .mkt{background:#fafaf8;border:1px solid #eee;border-radius:13px;padding:13px 14px;margin-bottom:11px}
.va .mkt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.va .mkt-t{font-size:.9rem;font-weight:950}
.va .mkt-tag{font-size:.64rem;color:#b3b0aa;font-weight:800}
.va .opt{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #e0ddd5;background:#fff;border-radius:11px;padding:11px 14px;margin-bottom:7px;cursor:pointer;transition:.1s}
.va .opt:active{transform:scale(.99)}
.va .opt.sel{border-color:var(--g);background:#1a7a440d}
.va .nm{font-size:.86rem;font-weight:850;color:#333}
.va .opt.sel .nm{color:var(--g)}
.va .fav{font-size:.62rem;font-weight:800;color:#b3b0aa;margin-left:6px}
.va .cuota{font-weight:950;font-size:.95rem;color:#222;background:#f0efe9;border-radius:8px;padding:5px 11px;min-width:56px;text-align:center}
.va .opt.sel .cuota{background:var(--g);color:#fff}
.va .cuota.hot{color:#fff;background:var(--gold)}
.va .pot{display:flex;justify-content:space-between;align-items:center;background:#1a7a440d;border:1px dashed #1a7a4455;border-radius:11px;padding:12px 14px;margin:4px 0 11px;font-weight:900;font-size:.86rem;color:var(--g)}
.va .cta{width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:14px;font-size:.95rem;font-weight:900;font-family:inherit;cursor:pointer}
.va .cta:active{transform:scale(.99)}
.va .foot{font-size:.7rem;color:#aaa;text-align:center;margin-top:9px}
.va .lb-h{font-size:1rem;font-weight:950;margin-bottom:10px}
.va .lb-h small{font-size:.72rem;color:#999;font-weight:700}
.va .row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f0ede6}
.va .row:last-child{border-bottom:0}
.va .row.k{background:#1a7a440a;border-radius:9px;padding:9px 8px}
.va .rk{text-align:center;font-weight:900;color:#999;font-size:.85rem}
.va .row.k .rk{color:var(--g);font-size:1.02rem}
.va .rn{font-weight:850;font-size:.87rem}
.va .rp{font-weight:950;color:var(--g);font-size:.84rem}

/* ══════════ VARIANTE B · Compacta ══════════ */
.vb .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.vb .h{font-size:1.25rem;font-weight:950}
.vb .sub{font-size:.74rem;color:var(--m);margin-top:2px}
.vb .racha{font-size:.74rem;font-weight:900;color:#b8860b;background:#fdf3dc;border:1px solid #f0e0b0;border-radius:20px;padding:6px 11px}
.vb .mkt{margin-bottom:16px}
.vb .mkt-t{font-size:.82rem;font-weight:950;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.vb .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vb .opt{background:#fff;border:1.5px solid var(--l);border-radius:12px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:.1s}
.vb .opt:active{transform:scale(.98)}
.vb .opt.sel{border-color:var(--g);background:#1a7a440d}
.vb .nm{font-size:.82rem;font-weight:850;color:#333;line-height:1.2}
.vb .opt.sel .nm{color:var(--g)}
.vb .c{font-size:.9rem;font-weight:950;color:#666;align-self:flex-start;background:#f0efe9;border-radius:7px;padding:2px 9px}
.vb .opt.sel .c{background:var(--g);color:#fff}
.vb .opt.bomba .c{background:var(--gold);color:#fff}
.vb .otro{margin-top:8px;width:100%;background:#fff;border:1.5px dashed #d9cfa8;color:#a9820f;border-radius:11px;padding:10px;font:inherit;font-weight:850;font-size:.8rem;cursor:pointer}
.vb .lb{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px 15px;margin-top:4px}
.vb .lb-h{font-size:.85rem;font-weight:950;margin-bottom:9px}
.vb .lrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f2efe9;font-size:.83rem}
.vb .lrow:last-child{border-bottom:0}
.vb .lrow b{font-weight:850}
.vb .lrow .p{color:var(--g);font-weight:950}
.vb .bar{position:sticky;bottom:0;margin:14px -14px 0;padding:12px 16px;background:#fff;border-top:1px solid var(--l);display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px #0000000d}
.vb .bar .potv{font-weight:950;color:var(--g);font-size:1rem;white-space:nowrap}
.vb .bar .cap{font-size:.64rem;color:#aaa;font-weight:700}
.vb .bar .cta{flex:1;background:var(--g);color:#fff;border:0;border-radius:11px;padding:13px;font:inherit;font-weight:900;font-size:.9rem;cursor:pointer}

/* ══════════ VARIANTE C · Fun / gamer ══════════ */
.vc .hero{background:linear-gradient(150deg,#1a7a44,#14653a);color:#fff;border-radius:20px;padding:20px 20px 18px;margin-bottom:16px;box-shadow:0 14px 34px #1a7a4433}
.vc .hero-t{font-size:1.3rem;font-weight:950;letter-spacing:-.01em}
.vc .hero-pot{font-size:.92rem;font-weight:700;margin-top:4px;opacity:.95}
.vc .hero-pot b{font-size:1.15rem;font-weight:950}
.vc .hero-row{display:flex;gap:8px;margin-top:13px}
.vc .chip{font-size:.72rem;font-weight:900;border-radius:20px;padding:6px 11px}
.vc .flame{background:#ffffff26;color:#ffe08a}
.vc .live{background:#ffffff1f;color:#d6ffe6}
.vc .hero-sub{font-size:.72rem;margin-top:12px;opacity:.8}
.vc .mkt{margin-bottom:16px}
.vc .mkt-t{font-size:1rem;font-weight:950;margin-bottom:10px}
.vc .opt{position:relative;display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--l);border-radius:15px;padding:15px 16px;margin-bottom:9px;cursor:pointer;transition:.12s}
.vc .opt:active{transform:scale(.98)}
.vc .opt.sel{border-color:var(--g);background:#1a7a440a;box-shadow:0 6px 16px #1a7a4422}
.vc .nm{font-size:.95rem;font-weight:900;color:#2a2a2a}
.vc .opt.sel .nm{color:var(--g)}
.vc .c{font-size:1.05rem;font-weight:950;color:#777;background:#f0efe9;border-radius:9px;padding:6px 12px}
.vc .opt.sel .c{background:var(--g);color:#fff}
.vc .opt.bomba{border-color:#f0d488;background:#fffbf0}
.vc .opt.bomba .c{background:var(--gold);color:#fff}
.vc .check{position:absolute;top:-9px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:.8rem;display:none;align-items:center;justify-content:center;font-weight:900;box-shadow:0 3px 8px #1a7a4455}
.vc .opt.sel .check{display:flex}
.vc .otro{width:100%;background:#fffbf0;border:2px dashed #ecd489;color:#a9820f;border-radius:14px;padding:13px;font:inherit;font-weight:900;font-size:.85rem;cursor:pointer}
.vc .cta-wrap{margin:6px 0 20px}
.vc .cta{width:100%;background:var(--g);color:#fff;border:0;border-radius:15px;padding:16px;font:inherit;font-weight:950;font-size:1rem;cursor:pointer;box-shadow:0 10px 24px #1a7a4433}
.vc .cta:active{transform:scale(.99)}
.vc .cta.ready{background:var(--gold);box-shadow:0 10px 24px #d9970f44}
.vc .lb{background:#fff;border:1px solid var(--l);border-radius:18px;padding:16px 16px 6px}
.vc .lb-h{font-size:1rem;font-weight:950;margin-bottom:14px}
.vc .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
.vc .pod{background:#faf8f3;border:1px solid var(--l);border-radius:12px;padding:10px 6px;text-align:center}
.vc .pod .medal{font-size:1.3rem}
.vc .pod .pn{font-size:.72rem;font-weight:900;margin-top:4px;line-height:1.1}
.vc .pod .pp{font-size:.72rem;font-weight:950;color:var(--g);margin-top:3px}
.vc .pod.first{background:#1a7a440d;border-color:#1a7a4433;transform:translateY(-6px)}
.vc .lrow{display:flex;justify-content:space-between;padding:9px 2px;border-top:1px solid #f2efe9;font-size:.84rem}
.vc .lrow b{font-weight:850}
.vc .lrow .p{color:var(--g);font-weight:950}
</style>
</head>
<body>
<div class="shell">
  <div class="switch">
    <div class="lbl">🎟️ Polla · 3 estilos · toca para elegir y prueba en el celular</div>
    <div class="seg">
      <button data-go="A">Casa de apuestas<b>clásico</b></button>
      <button data-go="B">Compacta<b>rápida</b></button>
      <button class="on" data-go="C">Fun<b>gamer</b></button>
    </div>
  </div>

  <!-- ═══ A ═══ -->
  <div class="panel va" id="pA"></div>
  <!-- ═══ B ═══ -->
  <div class="panel vb" id="pB"></div>
  <!-- ═══ C ═══ -->
  <div class="panel vc on" id="pC"></div>
</div>

<script>
var DATA={
  oro:{ic:'🥇',t:'Campeón Copa Oro',opts:[
    {n:'Chris Zapata',c:1.7,fav:1},{n:'Ale Schapira',c:2.2},{n:'Boris Zamorano',c:3.5},{n:'Dino Matilla',c:30,bomba:1}]},
  chupa:{ic:'💩',t:'Rey Chupa (último)',opts:[
    {n:'Dino Matilla',c:1.8,fav:1},{n:'Nico Molina',c:3.0},{n:'Cristian Cadiz',c:4.5},{n:'Chris Zapata',c:30,bomba:1}]}
};
var POOL=['Chris Zapata','Ale Schapira','Boris Zamorano','Raul Abatte','Sebastian Ramirez','Joaco Oliver','Dani Rosales','Ale Amaro','Eze Aguado','Rodrigo Cienfuegos','Javier Arrey','Emma Castillo','Martin Dubost','Diego Huth','Dino Matilla','Nico Molina','Cristian Cadiz','Andres Killinger','Ivan Kindermann','Vicente Moya','Seba Labra','Diego Hernandez'];
var POLLEROS=[['Javier Arrey',128],['Emma Castillo',119],['Diego Huth',104],['Eze Aguado',97],['Martin Dubost',88]];
var SUBT='Cierra el miércoles 21:00 ⏱️ · parte el americano';

/* ---------- render A ---------- */
function mktA(key){var m=DATA[key];
  var opts=m.opts.map(function(o){
    return '<div class="opt" data-c="'+o.c+'"><span class="nm">'+o.n+(o.fav?'<span class="fav">favorito</span>':(o.bomba?' 🤑':''))+'</span>'
      +'<span class="cuota'+(o.c>=10?' hot':'')+'">x'+o.c.toFixed(1)+'</span></div>';
  }).join('');
  return '<div class="mkt" data-market="'+key+'"><div class="mkt-h"><span class="mkt-t">'+m.ic+' '+m.t+'</span><span class="mkt-tag">cuota</span></div>'
    +'<div data-opts>'+opts+'</div>'
    +'<div class="srch open"><input placeholder="🔍 ¿Otro? escribe un nombre (paga x30)"><div class="sug"></div></div></div>';
}
document.getElementById('pA').innerHTML=
 '<div class="card"><div class="top"><div class="h">🎟️ Polla de la fecha</div><span class="racha">🔥 3 seguidas</span></div>'
 +'<div class="sub">'+SUBT+' · cada acierto paga su cuota en puntos 💰</div>'
 +mktA('oro')+mktA('chupa')
 +'<div class="pot"><span>Si aciertas las 2</span><span data-pot>+0.0 pts</span></div>'
 +'<button class="cta" data-cta>✅ Enviar mi polla</button>'
 +'<div class="foot">Mientras menos probable, más paga · el bombazo paga x30 🤑</div></div>'
 +'<div class="card"><div class="lb-h">🏆 Ranking de polleros <small>· temporada</small></div>'
 +POLLEROS.map(function(p,i){return '<div class="row'+(i===0?' k':'')+'"><span class="rk">'+(i===0?'👑':i+1)+'</span><span class="rn">'+p[0]+'</span><span class="rp">'+p[1]+' pts</span></div>';}).join('')
 +'</div>';

/* ---------- render B ---------- */
function mktB(key){var m=DATA[key];
  var opts=m.opts.map(function(o){
    return '<div class="opt'+(o.bomba?' bomba':'')+'" data-c="'+o.c+'"><span class="nm">'+o.n+'</span><span class="c">x'+o.c.toFixed(1)+'</span></div>';
  }).join('');
  return '<div class="mkt" data-market="'+key+'"><div class="mkt-t">'+m.ic+' '+m.t+'</div>'
    +'<div class="grid" data-opts>'+opts+'</div>'
    +'<button class="otro" data-otro>🔍 tirar un bombazo (x30)</button>'
    +'<div class="srch"><input placeholder="escribe un nombre…"><div class="sug"></div></div></div>';
}
document.getElementById('pB').innerHTML=
 '<div class="head"><div><div class="h">🎟️ Polla</div><div class="sub">'+SUBT+'</div></div><span class="racha">🔥 3</span></div>'
 +mktB('oro')+mktB('chupa')
 +'<div class="lb"><div class="lb-h">🏆 Ranking de polleros</div>'
 +POLLEROS.map(function(p,i){return '<div class="lrow"><b>'+(i===0?'👑 ':(i+1)+'. ')+p[0]+'</b><span class="p">'+p[1]+' pts</span></div>';}).join('')
 +'</div>'
 +'<div class="bar"><div><div class="potv" data-pot>+0.0 pts</div><div class="cap">si aciertas las 2</div></div><button class="cta" data-cta>Enviar mi polla</button></div>';

/* ---------- render C ---------- */
function mktC(key){var m=DATA[key];
  var opts=m.opts.map(function(o){
    return '<div class="opt'+(o.bomba?' bomba':'')+'" data-c="'+o.c+'"><span class="nm">'+o.n+(o.bomba?' 🤑':'')+'</span><span class="c">x'+o.c.toFixed(1)+'</span><span class="check">✓</span></div>';
  }).join('');
  return '<div class="mkt" data-market="'+key+'"><div class="mkt-t">'+m.ic+' ¿'+m.t+'?</div>'
    +'<div data-opts>'+opts+'</div>'
    +'<button class="otro" data-otro>🎯 tirar un bombazo (x30)</button>'
    +'<div class="srch"><input placeholder="escribe un nombre…"><div class="sug"></div></div></div>';
}
document.getElementById('pC').innerHTML=
 '<div class="hero"><div class="hero-t">🎟️ Polla de la fecha</div>'
 +'<div class="hero-pot">Puedes ganar <b data-pot>+0.0 pts</b></div>'
 +'<div class="hero-row"><span class="chip flame">🔥 3 seguidas</span><span class="chip live">🟢 23 ya jugaron</span></div>'
 +'<div class="hero-sub">'+SUBT+'</div></div>'
 +mktC('oro')+mktC('chupa')
 +'<div class="cta-wrap"><button class="cta" data-cta>✅ Enviar mi polla</button></div>'
 +'<div class="lb"><div class="lb-h">🏆 Polleros del año</div>'
 +'<div class="podium">'
 +'<div class="pod second"><div class="medal">🥈</div><div class="pn">'+POLLEROS[1][0]+'</div><div class="pp">'+POLLEROS[1][1]+'</div></div>'
 +'<div class="pod first"><div class="medal">👑</div><div class="pn">'+POLLEROS[0][0]+'</div><div class="pp">'+POLLEROS[0][1]+'</div></div>'
 +'<div class="pod third"><div class="medal">🥉</div><div class="pn">'+POLLEROS[2][0]+'</div><div class="pp">'+POLLEROS[2][1]+'</div></div>'
 +'</div>'
 +POLLEROS.slice(3).map(function(p,i){return '<div class="lrow"><b>'+(i+4)+'. '+p[0]+'</b><span class="p">'+p[1]+' pts</span></div>';}).join('')
 +'</div>';

/* ---------- switcher ---------- */
document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.seg button').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    document.getElementById('p'+b.dataset.go).classList.add('on');
    window.scrollTo(0,0);
  });
});

/* ---------- interactividad por panel ---------- */
function initSearch(group,market,picks,upd){
  var s=group.querySelector('.srch'); if(!s) return;
  var inp=s.querySelector('input'), sug=s.querySelector('.sug');
  inp.addEventListener('input',function(){
    var q=inp.value.trim().toLowerCase();
    if(!q){sug.classList.remove('show');sug.innerHTML='';return;}
    var ms=POOL.filter(function(n){return n.toLowerCase().indexOf(q)>=0}).slice(0,6);
    sug.innerHTML=ms.length?ms.map(function(n){return '<div data-n="'+n+'">'+n+'<span class="mini">x30 🤑</span></div>'}).join(''):'<div class="nores">Sin resultados</div>';
    sug.classList.add('show');
  });
  sug.addEventListener('click',function(e){
    var d=e.target.closest('div[data-n]'); if(!d) return;
    group.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel')});
    group.querySelectorAll('.opt.injected').forEach(function(x){x.remove()});
    var holder=group.querySelector('[data-opts]')||group;
    var el=document.createElement('div');
    el.className='opt injected sel'; el.dataset.c='30';
    el.innerHTML='<span class="io-nm">'+d.dataset.n+' 🤑 <b>BOMBAZO</b></span><span class="io-c">x30.0</span>';
    holder.insertBefore(el,holder.firstChild);
    picks[market]=30; inp.value=''; sug.classList.remove('show'); upd();
  });
}
document.querySelectorAll('.panel').forEach(function(panel){
  var picks={};
  function upd(){
    var vals=Object.keys(picks).map(function(k){return picks[k]});
    var sum=vals.reduce(function(a,b){return a+b},0);
    panel.querySelectorAll('[data-pot]').forEach(function(e){e.textContent='+'+sum.toFixed(1)+' pts'});
    var ready=Object.keys(picks).length>=2;
    panel.querySelectorAll('[data-cta]').forEach(function(e){e.classList.toggle('ready',ready)});
  }
  panel.querySelectorAll('[data-market]').forEach(function(group){
    var m=group.dataset.market;
    group.addEventListener('click',function(e){
      var opt=e.target.closest('.opt'); if(!opt||!group.contains(opt)) return;
      if(opt.classList.contains('injected')){return;}
      group.querySelectorAll('.opt.injected').forEach(function(x){x.remove()});
      group.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel')});
      opt.classList.add('sel'); picks[m]=parseFloat(opt.dataset.c)||0; upd();
    });
    initSearch(group,m,picks,upd);
  });
  panel.querySelectorAll('[data-otro]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var g=btn.closest('[data-market]'), s=g.querySelector('.srch');
      s.classList.toggle('open'); if(s.classList.contains('open')) s.querySelector('input').focus();
    });
  });
  panel.querySelectorAll('[data-cta]').forEach(function(cta){
    cta.addEventListener('click',function(){
      var n=Object.keys(picks).length;
      var sum=Object.keys(picks).map(function(k){return picks[k]}).reduce(function(a,b){return a+b},0);
      alert(n>=2?'¡Polla enviada! 🎟️ Hasta +'+sum.toFixed(1)+' pts 💰':'Elige en los 2 mercados 😉 ('+n+'/2)');
    });
  });
});
</script>
</body>
</html>
